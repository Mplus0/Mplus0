name: Update Profile Languages

on:
  schedule:
    - cron: '07 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/languages.yml'
      - '.github/scripts/generate-language-card.mjs'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: profile-language-card
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate light and dark language cards
        run: node .github/scripts/generate-language-card.mjs
        env:
          GITHUB_REPOSITORY_OWNER: Mplus0
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readme/resources/languages.svg readme/resources/languages-dark.svg
          if git diff --cached --quiet; then
            echo "Language cards are already up to date."
          else
            git commit -m "chore: update profile language cards"
            git push origin HEAD:main
          fi
